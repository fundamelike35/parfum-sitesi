<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lüks Parfüm Koleksiyonu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Maison de Parfum</h1>
        <p>Eşsiz Kokuların Baş Yapıtı</p>

    <section class="container">
        <div class="product-card">
            <h2>Kadın Parfümü</h2>
            <p>Çiçeksi ve kalıcı ferahlık.</p>
            <span class="price">750 TL</span>
        </div>

        <div class="product-card">
            <h2>Erkek Parfümü</h2>
            <p>Kalıcı ferahlık.</p>
            <span class="price">850 TL</span>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Maison de Parfum. Tüm hakları saklıdır.</p>
    </footer>

</body>
</html>
